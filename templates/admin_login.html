<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUMMARIX AI | Admin Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#24204e,#0b1020 65%);color:#f4f6ff;font:15px Arial}.box{width:min(430px,100%);padding:32px;border:1px solid #303b5b;border-radius:20px;background:#141b31}h1{font-size:26px}.muted{color:#9ba8c7;line-height:1.6}label{display:block;margin:18px 0 8px}input{width:100%;padding:13px;border-radius:10px;border:1px solid #394768;background:#0f172b;color:white;font:inherit}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:linear-gradient(100deg,#7659e9,#3b82f6);color:white;font:inherit;cursor:pointer}.error{color:#ffb7c1;background:#3c1d32;padding:10px;border-radius:9px}.brand{color:#b8adff;font-weight:bold;letter-spacing:1px}</style></head><body><main class="box"><div class="brand">SUMMARIX AI / ADMIN</div><h1>Administrator sign in</h1><p class="muted">Use your existing administrator account.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<p class="error">{{ message }}</p>{% endfor %}{% endwith %}<form method="post"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in securely</button></form></main></body></html>
