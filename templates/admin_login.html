
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUMMERIX AI | Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: #f5f5ff;
            background: linear-gradient(135deg, #101025, #202044, #111827);
        }

        .login-card {
            width: min(90%, 400px);
            padding: 35px;
            border: 1px solid #454568;
            border-radius: 18px;
            background: rgba(30, 30, 58, 0.94);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin-bottom: 8px;
            text-align: center;
            font-size: 27px;
        }

        .subtitle {
            margin-bottom: 28px;
            color: #b9b9d3;
            text-align: center;
        }

        label {
            display: block;
            margin: 16px 0 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #555579;
            border-radius: 9px;
            outline: none;
            color: white;
            background: #17172f;
        }

        input:focus {
            border-color: #9b8cff;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 9px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(90deg, #7657ed, #4385f5);
        }

        button:hover {
            opacity: 0.9;
        }

        .error {
            padding: 10px;
            border-radius: 8px;
            color: #ffb4b4;
            background: #512727;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <h1>SUMMERIX AI</h1>
        <p class="subtitle">Administrator Login</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('admin_login') }}">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Sign In</button>
        </form>
    </main>
</body>
</html>
